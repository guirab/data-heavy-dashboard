name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  data-determinism:
    # Re-downloads the source files listed in data/manifest.json, reruns the
    # pipeline and fails if any committed artifact under public/data/ changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore raw source files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/manifest.json') }}
      - run: pnpm data:download
      - run: pnpm data:verify
