name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  data-determinism:
    # Re-downloads the source files listed in data/manifest.json, reruns the
    # pipeline and fails if any committed artifact under public/data/ changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Raw zips are cached across runs and saved even when the download step fails,
      # so a portal throttle (it answers bursts with HTTP 405) costs a retry, not a
      # restart from zero. Cached files are verified against the manifest's SHA-256.
      - name: Restore raw source files
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            raw-${{ hashFiles('data/manifest.json') }}-
            raw-
      - run: pnpm data:download
      - name: Save raw source files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/manifest.json') }}-${{ github.run_id }}
      - run: pnpm data:verify
